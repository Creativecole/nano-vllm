[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.1"
authors = [{ name = "Xingkai Yu" }]
maintainers = [{ name = "Creativecole" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A lightweight vLLM implementation with experimental Triton and FP8 KV cache optimizations"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "numpy",
    "safetensors",
    "tqdm",
    "xxhash",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
bench = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/Creativecole/nano-vllm"
Repository = "https://github.com/Creativecole/nano-vllm"
Issues = "https://github.com/Creativecole/nano-vllm/issues"
Upstream = "https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
